<aside id="sidebar-filtros" class="sidebar">
    <div class="sidebar-header">
        <h2>Filtros de pozos</h2>
        <div class="sidebar-header-acciones">
            <button
                id="btn-info-auditoria"
                type="button"
                class="btn-info-i"
                aria-expanded="false"
                aria-controls="info-auditoria-panel"
                title="Información sobre estado de auditoría"
            >i</button>
            <button id="btn-toggle-sidebar" type="button" title="Contraer/expandir">☰</button>
        </div>
    </div>

    <div class="sidebar-body">
        <div id="contenedor-auditoria-panel"></div>

        <label for="select-auditoria" class="filtro-label">Auditoría de estado</label>
        <select id="select-auditoria" class="filtro-select">
            <option value="UTILES" selected>Pozos dentro del territorio</option>
            <option value="TODOS">Todos</option>
            <option value="COINCIDE">COINCIDE</option>
            <option value="NO COINCIDE">NO COINCIDE</option>
            <option value="SIN ENTIDAD">SIN ENTIDAD</option>
            <option value="FUERA DE LIMITES">FUERA DE LIMITES</option>
        </select>

        <div id="contador-pozos" class="resumen-contador">Cargando pozos...</div>

        <button id="btn-reset-filtros" type="button" class="btn-secundario">Restablecer</button>
    </div>
</aside>
